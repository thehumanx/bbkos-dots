# bbkOS hypridle: dim -> lock -> screen off -> suspend-then-hibernate.
# Events only (no polling). Hypridle also honours video/idle-inhibit, so playback is not interrupted.

general {
    lock_cmd = bbkos-lock                                                # single hyprlock, flock-guarded (see the script)
    before_sleep_cmd = loginctl lock-session                             # lock before any sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; loginctl lock-session   # screen on; lock again if the lock before sleep ever failed (no-op when locked)
}

listener {
    timeout = 150                                                        # 2.5 min: dim
    on-timeout = bbkos-awake idle-dim                                  # skipped while awake mode is on
    on-resume = bbkos-awake idle-dim-resume
}

listener {
    timeout = 150                                                        # keyboard backlight off (device name on this laptop)
    on-timeout = bbkos-awake idle-kbd
    on-resume = bbkos-awake idle-kbd-resume
}

listener {
    timeout = 300                                                        # 5 min: lock
    on-timeout = bbkos-awake idle-lock                                 # skipped while awake mode is on; a manual lock does not go through here
}

listener {
    timeout = 330                                                        # 5.5 min: screen off
    on-timeout = bbkos-awake idle-screen-off                           # skipped while awake mode is on
    on-resume = bbkos-awake idle-screen-on
}

listener {
    timeout = 900                                                        # 15 min: suspend, hibernate later (see sleep.conf.d, Task 9); not while awake mode is on
    on-timeout = bbkos-awake idle-suspend
}
