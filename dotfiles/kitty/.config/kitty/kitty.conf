# bbkOS kitty config. Login shell stays bash (POSIX env for uwsm/scripts); fish is interactive only.
shell fish

# Closing a window never asks, even with a program running in it (kitty's default, -1, asks then). Owner's choice 2026-11-06.
confirm_os_window_close 0

# Generated by bbkos-theme (colours, font size, padding, opacity). A missing file is harmless.
include ~/.local/state/bbkos/theme/kitty-theme.conf
