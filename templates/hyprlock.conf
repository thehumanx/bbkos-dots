# bbkOS hyprlock: the blurred wallpaper, a small round avatar, "Welcome", the date and a large clock, a frosted password
# field without a border, and the battery line.
# This is also the login screen: greetd logs in once at boot and Hyprland starts hyprlock first (docs/modules/session.md).
# Animations are off on purpose: hyprlock only runs while locked, and the screen turns off soon after.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = false
}

# The wallpaper chosen in the settings app (a fixed copy that bbkos-theme refreshes), not a screenshot of the screen.
background {
    monitor =
    path = @HOME@/.local/share/bbkos/wallpaper/current.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.75
}

# Avatar: a circle (rounding -1).
image {
    monitor =
    path = @HOME@/.config/hypr/lock-avatar.png
    size = 84
    rounding = -1
    border_size = 0
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome $USER
    font_size = 18
    font_family = $font
    color = rgb(235, 235, 235)
    position = 0, 190
    halign = center
    valign = center
}

# Full date, small.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 14
    font_family = $font
    color = rgba(235, 235, 235, 0.8)
    position = 0, 125
    halign = center
    valign = center
}

# Time, large.
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(245, 245, 245)
    position = 0, 50
    halign = center
    valign = center
}

# Frosted glass: the wallpaper is already blurred, so a soft translucent fill with no outline reads as frosted glass.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.14)
    outer_color = rgba(255, 255, 255, 0.0)
    check_color = rgba(255, 255, 255, 0.14)
    fail_color = rgba(255, 85, 85, 0.30)
    font_color = rgb(240, 240, 240)
    fade_on_empty = false
    rounding = -1
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -70
    halign = center
    valign = center
}

# Battery percent, with a charging icon while plugged in.
label {
    monitor =
    text = cmd[update:1000] bbkos-lock-battery
    font_size = 13
    font_family = $font
    color = rgba(235, 235, 235, 0.85)
    position = 0, -150
    halign = center
    valign = center
}
